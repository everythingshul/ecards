<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — everythingshul</title>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAuth();
renderShell('/admin/dashboard.html', `
  <div class="flex-between"><h2>Dashboard</h2></div>
  <div class="stat-grid" id="stats"><div class="small-muted">Loading…</div></div>
  <div class="card" id="dup-panel" style="display:none">
    <div class="flex-between"><h3 style="margin:0">Open Duplicate Flags</h3><a href="/admin/shuls.html?dup=1" class="btn btn-sm btn-outline">Review</a></div>
    <p class="small-muted" id="dup-text"></p>
  </div>
`);

(async () => {
  try {
    const { stats } = await api('/dashboard/stats');
    const tiles = [];
    if (stats.shuls) tiles.push(
      ['Total Shuls', stats.shuls.total], ['Pending Shuls', stats.shuls.pending],
      ['Approved Shuls', stats.shuls.approved], ['Paused Shuls', stats.shuls.paused]);
    if (stats.applicants) tiles.push(
      ['Total Applicants', stats.applicants.total], ['Pending Applicants', stats.applicants.pending],
      ['Approved Applicants', stats.applicants.approved]);
    if (stats.cards) tiles.push(
      ['Cards Issued', stats.cards.total], ['Cards Activated', stats.cards.activated],
      ['Total Loaded', fmtMoney(stats.cards.totalLoaded)]);
    qs('#stats').innerHTML = tiles.map(([label, num]) => `<div class="stat-tile"><div class="num">${esc(num)}</div><div class="label">${esc(label)}</div></div>`).join('');
    if (stats.duplicates?.open > 0) {
      qs('#dup-panel').style.display = 'block';
      qs('#dup-text').textContent = `${stats.duplicates.open} record(s) are flagged as possible duplicates and paused pending review.`;
    }
  } catch (err) { toast(err.message, true); }
})();
</script>
</body>
</html>
