<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();
const isSuperAdmin = Auth.user()?.role === 'super_admin';
renderShell('/admin/settings', `
  <h2>Settings</h2>
  <div class="tabs">
    <button class="active" data-t="org">Organization</button>
    <button data-t="seasons">Seasons</button>
    <button data-t="documents">Documents</button>
    <button data-t="emails">Auto Emails</button>
    <button data-t="content">Site Content</button>
    ${isSuperAdmin ? '<button data-t="backups">Backups</button>' : ''}
  </div>

  <div id="panel-org">
    <div class="card">
      <h3>Organization Info & Branding</h3>
      <label>Organization Name</label><input id="org-name">
      <div class="grid-2">
        <div><label>Primary Color</label><input id="org-primary_color" type="color"></div>
        <div><label>Accent Color</label><input id="org-accent_color" type="color"></div>
      </div>
      <label>Support Email</label><input id="org-support_email">
      <label>Support Phone</label><input id="org-support_phone">
      <label>Address</label><input id="org-address">
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveOrg()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Default Reply-To Email</h3>
      <p class="small-muted">Where replies to automatic system emails go by default. Leave blank to use the sending address itself. Individual email templates (Auto Emails tab) can override this per-template.</p>
      <label>Default Reply-To</label><input id="org-reply_to" placeholder="e.g. office@yourorg.org">
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveDefaultReplyTo()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Our SMS Number</h3>
      <p class="small-muted">Your SimpleSender sending number. Incoming-message sync (SMS Center &gt; Inbox) uses this to tell replies to you apart from messages you sent — anything addressed to this number is inbound. Update this if the number is ever reassigned.</p>
      <label>SMS Number</label><input id="org-sms_own_number" placeholder="+18555996232">
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveSmsOwnNumber()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Gift Card Loading (disccardpromos)</h3>
      <p class="small-muted">disccardpromos loads money onto a card by crediting a customer's balance against one of their Packages — there's no separate "assign a card" step. Enter the Package/Discount ID to use; every approved applicant's card amount is loaded against this same package, regardless of season.</p>
      <div id="giftcard-status" style="margin:10px 0"></div>
      <label>Package (Discount) ID</label><input id="org-discount_id" placeholder="e.g. 4821">
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveDiscountId()">Save</button>
      <div class="divider"></div>
      <h4 style="margin-bottom:4px">Applicant Info Pushed to disccardpromos</h4>
      <p class="small-muted">Applicant ID is always sent — it's how a record gets matched to their disccardpromos customer at all. Choose which other fields go along with it, on approval and every save afterward.</p>
      <div id="push-fields-list" style="margin:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px"></div>
      <button class="btn btn-sm btn-primary" style="margin-top:8px" onclick="savePushFields()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Application Restrictions</h3>
      <label>Allowed Zip Codes <span class="small-muted">(comma-separated, leave blank to accept any zip code)</span></label>
      <textarea id="org-allowed_zips" rows="3" placeholder="e.g. 11201, 11211, 11213"></textarea>
      <p class="small-muted">Applicants outside these zip codes are declined automatically at submission. The submitting shul is never told this happened or shown which applicants were declined this way.</p>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveZipRestriction()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Shul Portal</h3>
      <div class="checkbox-row"><input type="checkbox" id="shul-card-amount-visible"><label style="margin:0">Shuls can see the card amount on their own applicants</label></div>
      <p class="small-muted">When off, the "Card $" column and field are hidden from the shul portal (list and applicant detail) but remain fully visible to admins.</p>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveShulCardAmountVisible()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Homepage Popup</h3>
      <p class="small-muted">Shows once per visit on the public homepage. Turn it off and the homepage looks exactly as if it were never there.</p>
      <div class="checkbox-row"><input type="checkbox" id="popup-enabled"><label style="margin:0">Show popup on homepage</label></div>
      <label style="margin-top:14px">Message</label>
      <textarea id="popup-message" rows="4" placeholder="e.g. Applications for this season close August 30th."></textarea>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="savePopup()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Full System Export</h3>
      <p class="small-muted">Download everything: every shul, applicant, card, transaction, store, billing record, task, and note, as one Excel workbook with a separate sheet per table.</p>
      <button class="btn btn-sm btn-primary" onclick="downloadFullExport()">Download Full System Export (.xlsx)</button>
    </div>
  </div>

  <div id="panel-seasons" style="display:none">
    <div class="card">
      <div class="flex-between"><h3 style="margin:0">Seasons</h3><button class="btn btn-sm btn-primary" onclick="openNewSeason()">+ New Season</button></div>
      <div id="seasons-list" style="margin-top:14px">Loading…</div>
    </div>
  </div>

  <div id="panel-documents" style="display:none">
    <p class="small-muted">Each of these can either use your own uploaded PDF as-is, or a simple generated document built from the text below. Whichever is used, the signer's signature is stamped onto the bottom of the last page automatically when they sign.</p>
    <div class="card">
      <h3>Shul Contract</h3>
      <p class="small-muted" id="pdf-status">Checking…</p>
      <input type="file" id="contract-pdf-file" accept="application/pdf">
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="uploadContractPdf()">Upload PDF</button>
        <button class="btn btn-sm btn-outline" id="btn-remove-pdf" style="display:none" onclick="removeContractPdf()">Remove & Use Generated Template</button>
      </div>
      <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
      <textarea id="contract-text" rows="8"></textarea>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="saveContractText()">Save Text</button>
        <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('shul','Shul Contract Signature Placement')">Edit Signature Placement</button>
        <button class="btn btn-sm btn-outline" id="btn-fields-shul" style="display:none" onclick="openContractFieldEditor('shul','Shul Contract Field Placement')">Edit Contract Field Placement</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Applicant Agreement</h3>
      <p class="small-muted" id="doc-pdf-status-applicant">Checking…</p>
      <input type="file" id="doc-pdf-file-applicant" accept="application/pdf">
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="uploadDocPdf('applicant')">Upload PDF</button>
        <button class="btn btn-sm btn-outline" id="btn-remove-doc-pdf-applicant" style="display:none" onclick="removeDocPdf('applicant')">Remove & Use Generated Template</button>
      </div>
      <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
      <textarea id="doc-text-applicant" rows="8"></textarea>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="saveDocText('applicant')">Save Text</button>
        <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('applicant','Applicant Agreement Signature Placement')">Edit Signature Placement</button>
        <button class="btn btn-sm btn-outline" id="btn-fields-applicant" style="display:none" onclick="openContractFieldEditor('applicant','Applicant Agreement Field Placement')">Edit Contract Field Placement</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Store Agreement</h3>
      <p class="small-muted" id="doc-pdf-status-store">Checking…</p>
      <input type="file" id="doc-pdf-file-store" accept="application/pdf">
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="uploadDocPdf('store')">Upload PDF</button>
        <button class="btn btn-sm btn-outline" id="btn-remove-doc-pdf-store" style="display:none" onclick="removeDocPdf('store')">Remove & Use Generated Template</button>
      </div>
      <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
      <textarea id="doc-text-store" rows="8"></textarea>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="saveDocText('store')">Save Text</button>
        <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('store','Store Agreement Signature Placement')">Edit Signature Placement</button>
        <button class="btn btn-sm btn-outline" id="btn-fields-store" style="display:none" onclick="openContractFieldEditor('store','Store Agreement Field Placement')">Edit Contract Field Placement</button>
      </div>
    </div>
  </div>

  <div id="panel-emails" style="display:none">
    <p class="small-muted">Edit the text of automatic system emails (contract ready, approvals, invites, password reset). <code>{{placeholders}}</code> get filled in with real values when each email actually sends — leave them as-is, just move them where you want.</p>
    <div id="email-templates-list">Loading…</div>
  </div>

  <div id="panel-content" style="display:none">
    <div class="card">
      <h3>Hero Section</h3>
      <p class="small-muted">The large banner at the top of the homepage.</p>
      <label>Eyebrow Text <span class="small-muted">(small text above the headline; leave blank to use the organization name)</span></label>
      <input id="content-hero-eyebrow" placeholder="e.g. Kipas Hair BP Platform">
      <label>Headline <span class="small-muted">(leave blank to use the organization name)</span></label>
      <input id="content-hero-heading" placeholder="e.g. Kipas Hair BP Platform">
      <label style="margin-top:14px">Buttons <span class="small-muted">(leave empty to use the default set)</span></label>
      <div id="hero-buttons-list"></div>
      <button class="btn btn-sm btn-outline" style="margin-top:10px" onclick="addContentButton('hero')">+ Add Button</button>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveHeroSection()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Schedule Section</h3>
      <p class="small-muted">The "When applications are open" cards on the homepage. Each card shows the open/close window of the form it's linked to.</p>
      <label>Heading <span class="small-muted">(leave blank for the default)</span></label>
      <input id="content-schedule-heading" placeholder="e.g. When applications are open">
      <label style="margin-top:14px">Cards</label>
      <div id="schedule-items-list"></div>
      <button class="btn btn-sm btn-outline" style="margin-top:10px" onclick="addScheduleItem()">+ Add Card</button>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveScheduleSection()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Header Buttons</h3>
      <p class="small-muted">Shown at the top of the public homepage. Leave empty to use the default ("Sign In").</p>
      <div id="header-buttons-list"></div>
      <button class="btn btn-sm btn-outline" style="margin-top:10px" onclick="addContentButton('header')">+ Add Button</button>
      <button class="btn btn-sm btn-primary" style="margin-top:10px;margin-left:8px" onclick="saveContentButtons('header')">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Footer Buttons</h3>
      <p class="small-muted">Shown at the bottom of the public homepage. Leave empty to use the default set.</p>
      <div id="footer-buttons-list"></div>
      <button class="btn btn-sm btn-outline" style="margin-top:10px" onclick="addContentButton('footer')">+ Add Button</button>
      <button class="btn btn-sm btn-primary" style="margin-top:10px;margin-left:8px" onclick="saveContentButtons('footer')">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>About Section</h3>
      <label>Heading <span class="small-muted">(leave blank for the default)</span></label>
      <input id="content-about-heading" placeholder="e.g. About">
      <label>About Text <span class="small-muted">(leave blank to use the default mission statement)</span></label>
      <textarea id="content-about" rows="4"></textarea>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveAboutText()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="flex-between"><h3 style="margin:0">FAQ</h3><a href="/faq" target="_blank" class="btn btn-sm btn-outline">View Public Page</a></div>
      <p class="small-muted">Shown at <code>/faq</code>.</p>
      <div id="faq-items-list"></div>
      <button class="btn btn-sm btn-outline" style="margin-top:10px" onclick="addFaqItem()">+ Add Question</button>
      <button class="btn btn-sm btn-primary" style="margin-top:10px;margin-left:8px" onclick="saveFaqItems()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="flex-between"><h3 style="margin:0">Contact Form Submissions</h3><a href="/contact" target="_blank" class="btn btn-sm btn-outline">View Public Page</a></div>
      <p class="small-muted">Every submission also emails your Support Email address (Organization tab), if one is set.</p>
      <div id="contact-submissions-list" style="margin-top:10px">Loading…</div>
    </div>
  </div>

  ${isSuperAdmin ? `
  <div id="panel-backups" style="display:none">
    <div class="card">
      <div class="flex-between"><h3 style="margin:0">Database Backups</h3><div class="pill-row">
        <button class="btn btn-sm btn-outline" onclick="downloadBackupNow()">Download Backup Now</button>
        <button class="btn btn-sm btn-primary" onclick="runBackupNow()">Run Backup</button>
      </div></div>
      <p class="small-muted">A full snapshot of the database is taken automatically every few hours (kept on this server's disk). "Run Backup" takes one immediately; "Download Backup Now" takes one and downloads it straight to your computer — the only copy that's off this server, so do this periodically and keep it somewhere safe.</p>
      <div id="backups-list" style="margin-top:14px">Loading…</div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">Full Data Export / Migration</h3>
      <p class="small-muted">The backups above are the database only. This exports <strong>everything</strong> on this server — the database plus every uploaded file (signed contracts, signatures, logos, store bills, form images, update attachments) — as one archive. Use it to move to a different Render account: download it here, then upload it on the new (empty) service's own Settings &gt; Backups page.</p>
      <div class="pill-row">
        <button class="btn btn-sm btn-primary" onclick="downloadFullExport()">Download Full Export</button>
        <button class="btn btn-sm btn-outline" onclick="qs('#migration-import-file').click()">Restore From Full Export…</button>
        <input type="file" id="migration-import-file" accept=".tar.gz,.gz" style="display:none" onchange="uploadFullImport(this)">
      </div>
      <p class="small-muted" style="margin-top:10px">Restore only works on a service that has no shuls/applicants yet — it refuses to overwrite a live instance. The service restarts automatically once the restore finishes; give it about a minute, then log back in.</p>
    </div>
  </div>` : ''}
`);

qsa('.tabs button').forEach(b => b.addEventListener('click', () => {
  qsa('.tabs button').forEach(x => x.classList.remove('active')); b.classList.add('active');
  ['org','seasons','documents','emails','content','backups'].forEach(t => { const el = qs('#panel-'+t); if (el) el.style.display = t === b.dataset.t ? 'block' : 'none'; });
  if (b.dataset.t === 'emails') loadEmailTemplates();
  if (b.dataset.t === 'content') loadContent();
  if (b.dataset.t === 'backups') loadBackups();
}));

async function loadOrg() {
  const { organization: o } = await api('/orgs/me');
  qs('#org-name').value = o.name || '';
  qs('#org-primary_color').value = o.primary_color || '#241a15';
  qs('#org-accent_color').value = o.accent_color || '#c9a76a';
  qs('#org-support_email').value = o.support_email || '';
  qs('#org-support_phone').value = o.support_phone || '';
  qs('#org-address').value = o.address || '';
}
async function loadZipRestriction() {
  const { settings } = await api('/settings');
  qs('#org-allowed_zips').value = settings.allowed_zip_codes || '';
}
window.saveZipRestriction = async () => {
  try { await api('/settings', { method: 'PUT', body: { allowed_zip_codes: qs('#org-allowed_zips').value } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
async function loadDefaultReplyTo() {
  const { settings } = await api('/settings');
  qs('#org-reply_to').value = settings.email_reply_to || '';
}
window.saveDefaultReplyTo = async () => {
  try { await api('/settings', { method: 'PUT', body: { email_reply_to: qs('#org-reply_to').value } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
async function loadSmsOwnNumber() {
  const { settings } = await api('/settings');
  qs('#org-sms_own_number').value = settings.sms_own_number || '+18555996232';
}
window.saveSmsOwnNumber = async () => {
  try { await api('/settings', { method: 'PUT', body: { sms_own_number: qs('#org-sms_own_number').value } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
async function loadDiscountId() {
  const { settings } = await api('/settings');
  qs('#org-discount_id').value = settings.disccardpromos_discount_id || '';
  try {
    const { mockMode, missing } = await api('/settings/giftcard-status');
    qs('#giftcard-status').innerHTML = mockMode
      ? `<div style="padding:8px 12px;border-radius:6px;background:#fde8e8;color:#7a1f1f;font-size:13px"><strong>MOCK MODE</strong> — nothing is actually sent to disccardpromos. Every approval "succeeds" but no account/card/funds are created on their side. Missing on the server: ${esc(missing.join(', ') || '(unknown)')}.</div>`
      : `<div style="padding:8px 12px;border-radius:6px;background:#e8f5e9;color:#1b5e20;font-size:13px"><strong>LIVE</strong> — connected to disccardpromos.</div>`;
  } catch { /* status check is best-effort, not worth blocking the page on */ }
}
window.saveDiscountId = async () => {
  try { await api('/settings', { method: 'PUT', body: { disccardpromos_discount_id: qs('#org-discount_id').value.trim() } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
// Keep in sync with PROVIDER_PUSH_FIELDS in routes/applicants.js — the
// server falls back to "everything" if this setting was never saved, so an
// org that's never opened this panel sees no change in behavior.
const PROVIDER_PUSH_FIELDS = [
  ['first_name', 'First Name'], ['last_name', 'Last Name'], ['home_phone', 'Home Phone'],
  ['husband_cell', 'Husband Cell'], ['wife_cell', 'Wife Cell'], ['email', 'Email'],
  ['address', 'Address'], ['city', 'City'], ['state', 'State'], ['zip', 'Zip'],
];
async function loadPushFields() {
  const { settings } = await api('/settings');
  let selected;
  try { selected = JSON.parse(settings.disccardpromos_push_fields); } catch { selected = null; }
  if (!Array.isArray(selected)) selected = PROVIDER_PUSH_FIELDS.map(([key]) => key);
  qs('#push-fields-list').innerHTML = PROVIDER_PUSH_FIELDS.map(([key, label]) =>
    `<label class="checkbox-row"><input type="checkbox" class="push-field" value="${key}" ${selected.includes(key) ? 'checked' : ''}> ${esc(label)}</label>`).join('');
}
window.savePushFields = async () => {
  const selected = qsa('.push-field:checked').map(c => c.value);
  try { await api('/settings', { method: 'PUT', body: { disccardpromos_push_fields: JSON.stringify(selected) } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
async function loadPopup() {
  const { settings } = await api('/settings');
  qs('#popup-enabled').checked = settings.homepage_popup_enabled === '1';
  qs('#popup-message').value = settings.homepage_popup_message || '';
}
window.savePopup = async () => {
  try { await api('/settings', { method: 'PUT', body: { homepage_popup_enabled: qs('#popup-enabled').checked ? '1' : '0', homepage_popup_message: qs('#popup-message').value } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
async function loadShulCardAmountVisible() {
  const { settings } = await api('/settings');
  // Defaults to visible (matches pre-toggle behavior) unless explicitly turned off.
  qs('#shul-card-amount-visible').checked = settings.shul_card_amount_visible !== '0';
}
window.saveShulCardAmountVisible = async () => {
  try { await api('/settings', { method: 'PUT', body: { shul_card_amount_visible: qs('#shul-card-amount-visible').checked ? '1' : '0' } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
window.downloadFullExport = () => downloadAuthed('/system-export', 'kipas-hair-bp-full-export.xlsx');

// ============================= Site Content =============================
const CONTENT_BUTTON_SETTING_KEY = { header: 'header_nav_buttons', footer: 'footer_nav_buttons', hero: 'cta_buttons' };
// Mirrors the fallback values in frontend/index.html — shown here so the admin
// edits/removes what's actually live instead of starting from a blank slate.
const DEFAULT_HEADER_BUTTONS = [{ label: 'Sign In', url: '/login' }];
const DEFAULT_FOOTER_BUTTONS = [
  { label: 'Register a Shul', url: '/apply' },
  { label: 'Apply as a Store', url: '/apply-store' },
  { label: 'Ezras Habayis Application', url: '/apply-ezras-habayis' },
  { label: 'FAQ', url: '/faq' },
  { label: 'Contact Us', url: '/contact' },
  { label: 'Sign In', url: '/login' },
];
const DEFAULT_CTA_BUTTONS = [
  { label: 'Register Your Shul', url: '/apply' },
  { label: 'Apply as a Participating Store', url: '/apply-store' },
  { label: 'Ezras Habayis Application', url: '/apply-ezras-habayis' },
  { label: 'Sign In', url: '/login' },
];
const DEFAULT_ABOUT_TEXT = "We exist to make it simple, dignified, and reliable for shuls to help their families before Yom Tov. Every shul that signs on gets a clear process, every applicant gets a fair and timely answer, and every card is tracked from issuance to the register, so generosity never gets lost in paperwork.";
const DEFAULT_SCHEDULE_ITEMS = [
  { formSlug: 'shul-application', label: 'Shul Registration' },
  { formSlug: 'store-application', label: 'Store Application' },
  { formSlug: 'ezras-habayis-application', label: 'Ezras Habayis Application' },
];
let buttonDrafts = { header: [], footer: [], hero: [] };
let faqItemsDraft = [];
let scheduleItemsDraft = [];
let allFormsForSchedule = [];
function wireButtonInputs(kind) {
  const draft = buttonDrafts[kind];
  qsa(`#${kind}-buttons-list .cb-label`).forEach(el => el.addEventListener('input', () => { draft[+el.dataset.idx].label = el.value; }));
  qsa(`#${kind}-buttons-list .cb-url`).forEach(el => el.addEventListener('input', () => { draft[+el.dataset.idx].url = el.value; }));
}
function renderContentButtons(kind) {
  const draft = buttonDrafts[kind];

// Two kinds of card: 'form' looks up a real form's own scheduling
// (open/opens/closes) and renders it automatically on the homepage;
// 'custom' is just whatever text is typed here — for anything on the
// schedule that isn't itself a submittable form (a deadline reminder, an
// event date, a note). Items saved before this distinction existed have no
// `type` at all and are treated as 'form', same as they always behaved.
function renderScheduleItems() {
  const options = allFormsForSchedule.map(f => `<option value="${esc(f.slug)}">${esc(f.name)}</option>`).join('');
  qs('#schedule-items-list').innerHTML = scheduleItemsDraft.length ? scheduleItemsDraft.map((it, i) => {
    const type = it.type || 'form';
    return `<div class="card" style="margin:8px 0;padding:12px">
      <div style="display:flex;gap:8px;align-items:center">
        <select class="si-type" data-idx="${i}" style="max-width:180px"><option value="form" ${type==='form'?'selected':''}>Linked to a form</option><option value="custom" ${type==='custom'?'selected':''}>Custom</option></select>
        <input placeholder="Card label" value="${esc(it.label||'')}" style="flex:1" class="si-label" data-idx="${i}">
        <button type="button" class="btn btn-sm btn-outline" onclick="removeScheduleItem(${i})">Remove</button>
      </div>
      ${type === 'form'
        ? `<select class="si-slug" data-idx="${i}" style="margin-top:8px">${options}</select>`
        : `<input class="si-window" data-idx="${i}" placeholder="Window text (optional) — e.g. Opens September 1st" style="margin-top:8px">
           <textarea class="si-description" data-idx="${i}" placeholder="Description (optional)" rows="2" style="margin-top:8px"></textarea>`}
    </div>`;
  }).join('') : '<p class="small-muted">No cards — the schedule section will be empty.</p>';
  qsa('.si-type').forEach(el => el.addEventListener('change', () => { scheduleItemsDraft[+el.dataset.idx].type = el.value; renderScheduleItems(); }));
  qsa('.si-label').forEach(el => el.addEventListener('input', () => { scheduleItemsDraft[+el.dataset.idx].label = el.value; }));
  qsa('.si-slug').forEach(el => { el.value = scheduleItemsDraft[+el.dataset.idx].formSlug || ''; el.addEventListener('change', () => { scheduleItemsDraft[+el.dataset.idx].formSlug = el.value; }); });
  qsa('.si-window').forEach(el => { el.value = scheduleItemsDraft[+el.dataset.idx].window || ''; el.addEventListener('input', () => { scheduleItemsDraft[+el.dataset.idx].window = el.value; }); });
  qsa('.si-description').forEach(el => { el.value = scheduleItemsDraft[+el.dataset.idx].description || ''; el.addEventListener('input', () => { scheduleItemsDraft[+el.dataset.idx].description = el.value; }); });
}
window.addScheduleItem = () => {
  scheduleItemsDraft.push({ type: 'form', label: '', formSlug: allFormsForSchedule[0]?.slug || '' });
  renderScheduleItems();
};
window.removeScheduleItem = (i) => {
  scheduleItemsDraft.splice(i, 1);
  renderScheduleItems();
};

async function loadContent() {
  const [{ settings }, { forms }] = await Promise.all([api('/settings'), api('/forms')]);
  const parseList = (v) => { try { const p = JSON.parse(v || '[]'); return Array.isArray(p) ? p : []; } catch { return []; } };
  const listOrDefault = (v, fallback) => { const p = parseList(v); return p.length ? p : fallback.map(b => ({ ...b })); };
  const orgName = qs('#org-name').value || 'Kipas Hair BP Platform';
  buttonDrafts.header = listOrDefault(settings.header_nav_buttons, DEFAULT_HEADER_BUTTONS);
  buttonDrafts.footer = listOrDefault(settings.footer_nav_buttons, DEFAULT_FOOTER_BUTTONS);
  buttonDrafts.hero = listOrDefault(settings.cta_buttons, DEFAULT_CTA_BUTTONS);
  faqItemsDraft = parseList(settings.faq_items);
  allFormsForSchedule = forms.filter(f => f.is_active).map(f => ({ slug: f.slug, name: f.name }));
  scheduleItemsDraft = listOrDefault(settings.schedule_items, DEFAULT_SCHEDULE_ITEMS);
  qs('#content-hero-eyebrow').value = settings.homepage_hero_eyebrow || orgName;
  qs('#content-hero-heading').value = settings.homepage_hero_heading || orgName;
  qs('#content-schedule-heading').value = settings.homepage_schedule_heading || 'When applications are open';
  qs('#content-about-heading').value = settings.homepage_about_heading || 'About';
  qs('#content-about').value = settings.homepage_about_text || DEFAULT_ABOUT_TEXT;
  renderContentButtons('header');
  renderContentButtons('footer');
  renderContentButtons('hero');
  renderScheduleItems();
  renderFaqItems();
  loadContactSubmissions();
}

// Per-season disccardpromos credentials (see services/giftcard.js) — for
// now, each season can hold its own API base/key, falling back to the
// org-wide DISCCARDPROMOS_API_BASE/KEY env vars when left blank. The key
// itself is never sent back from the server once saved (same treatment as
// a password) — the field just shows a placeholder indicating one is set,
// and is left untouched unless a new value is typed.
window.openSeasonGiftCardApi = (id, name, apiBase, hasKey) => {
  const body = `
    <p class="small-muted">Leave both blank to use the org-wide default (Settings above). Both must be set for this season's override to take effect.</p>
    <label>API Base URL</label><input id="sg-base" value="${esc(apiBase)}" placeholder="https://api.disccardpromos.com">
    <label>API Key</label><input id="sg-key" type="password" placeholder="${hasKey ? 'Already set — leave blank to keep it' : 'Not set — inherits the org-wide key'}">
  `;
  openModal(`${name}: Gift Card API`, body, `<button class="btn btn-primary btn-sm" onclick="saveSeasonGiftCardApi('${id}')">Save</button>`);
};
window.saveSeasonGiftCardApi = async (id) => {
  const body = { disccardpromos_api_base: qs('#sg-base').value };
  const key = qs('#sg-key').value;
  if (key) body.disccardpromos_api_key = key;
  try { await api(`/seasons/${id}`, { method: 'PUT', body }); toast('Saved'); closeModal(); loadSeasons(); } catch (err) { toast(err.message, true); }
};

function fmtBytes(n) { if (n < 1024) return n + ' B'; if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB'; return (n/(1024*1024)).toFixed(1) + ' MB'; }
async function loadBackups() {
  if (!isSuperAdmin) return;
  const { backups } = await api('/settings/backups');
  qs('#backups-list').innerHTML = backups.length ? `<table><thead><tr><th>Created</th><th>Size</th><th></th></tr></thead><tbody>
      ${backups.map(b => `<tr><td>${fmtDateTime(b.createdAt)}</td><td>${fmtBytes(b.sizeBytes)}</td>
        <td><button class="btn btn-sm btn-outline" onclick="downloadAuthed('/settings/backups/${encodeURIComponent(b.filename)}/download','${esc(b.filename)}')">Download</button></td></tr>`).join('')}
    </tbody></table>` : '<p class="small-muted">No backups yet — the first automatic one runs shortly after this server started.</p>';
}

window.uploadFullImport = async (input) => {
  const file = input.files[0];
  if (!file) return;
  if (!confirm(`Restore "${file.name}" onto THIS server? This only works if this service has no shuls/applicants yet, and will restart the app once done.`)) { input.value = ''; return; }
  const fd = new FormData();
  fd.append('archive', file);
  try {
    const r = await api('/migration/import', { method: 'POST', isForm: true, body: fd });
    toast(r.message, false);
  } catch (err) { toast(err.message, true); }
  input.value = '';
};
