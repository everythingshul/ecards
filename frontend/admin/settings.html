<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();
const isSuperAdmin = Auth.user()?.role === 'super_admin';
renderShell('/admin/settings.html', `
  <h2>Settings</h2>
  <div class="tabs">
    <button class="active" data-t="org">Organization</button>
    <button data-t="seasons">Seasons</button>
    <button data-t="fields">Required Fields</button>
    <button data-t="documents">Documents</button>
    <button data-t="emails">Auto Emails</button>
    ${isSuperAdmin ? '<button data-t="backups">Backups</button>' : ''}
  </div>

  <div id="panel-org">
    <div class="card">
      <h3>Organization Info & Branding</h3>
      <label>Organization Name</label><input id="org-name">
      <div class="grid-2">
        <div><label>Primary Color</label><input id="org-primary_color" type="color"></div>
        <div><label>Accent Color</label><input id="org-accent_color" type="color"></div>
      </div>
      <label>Support Email</label><input id="org-support_email">
      <label>Support Phone</label><input id="org-support_phone">
      <label>Address</label><input id="org-address">
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveOrg()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Application Restrictions</h3>
      <label>Allowed Zip Codes <span class="small-muted">(comma-separated, leave blank to accept any zip code)</span></label>
      <textarea id="org-allowed_zips" rows="3" placeholder="e.g. 11201, 11211, 11213"></textarea>
      <p class="small-muted">Applicants outside these zip codes are declined automatically at submission. The submitting shul is never told this happened or shown which applicants were declined this way.</p>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveZipRestriction()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Homepage Popup</h3>
      <p class="small-muted">Shows once per visit on the public homepage. Turn it off and the homepage looks exactly as if it were never there.</p>
      <div class="checkbox-row"><input type="checkbox" id="popup-enabled"><label style="margin:0">Show popup on homepage</label></div>
      <label style="margin-top:14px">Message</label>
      <textarea id="popup-message" rows="4" placeholder="e.g. Applications for this season close August 30th."></textarea>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="savePopup()">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Full System Export</h3>
      <p class="small-muted">Download everything: every shul, applicant, card, transaction, store, billing record, task, and note, as one Excel workbook with a separate sheet per table.</p>
      <button class="btn btn-sm btn-primary" onclick="downloadFullExport()">Download Full System Export (.xlsx)</button>
    </div>
  </div>

  <div id="panel-seasons" style="display:none">
    <div class="card">
      <div class="flex-between"><h3 style="margin:0">Seasons</h3><button class="btn btn-sm btn-primary" onclick="openNewSeason()">+ New Season</button></div>
      <div id="seasons-list" style="margin-top:14px">Loading…</div>
    </div>
  </div>

  <div id="panel-fields" style="display:none">
    <div class="card">
      <h3>Shul Application Required Fields</h3>
      <p class="small-muted">Toggle which fields are required on the public shul form, and which fields admins may fill in even when normally locked.</p>
      <div id="fields-shul"></div>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveFields('shul')">Save</button>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Applicant Submission Required Fields</h3>
      <div id="fields-applicant"></div>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" onclick="saveFields('applicant')">Save</button>
    </div>
  </div>

  <div id="panel-documents" style="display:none">
    <p class="small-muted">Each of these can either use your own uploaded PDF as-is, or a simple generated document built from the text below. Whichever is used, the signer's signature is stamped onto the bottom of the last page automatically when they sign.</p>
    <div class="card">
      <h3>Shul Contract</h3>
      <p class="small-muted" id="pdf-status">Checking…</p>
      <input type="file" id="contract-pdf-file" accept="application/pdf">
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="uploadContractPdf()">Upload PDF</button>
        <button class="btn btn-sm btn-outline" id="btn-remove-pdf" style="display:none" onclick="removeContractPdf()">Remove & Use Generated Template</button>
      </div>
      <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
      <textarea id="contract-text" rows="8"></textarea>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="saveContractText()">Save Text</button>
        <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('shul','Shul Contract Signature Placement')">Edit Signature Placement</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Applicant Agreement</h3>
      <p class="small-muted" id="doc-pdf-status-applicant">Checking…</p>
      <input type="file" id="doc-pdf-file-applicant" accept="application/pdf">
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="uploadDocPdf('applicant')">Upload PDF</button>
        <button class="btn btn-sm btn-outline" id="btn-remove-doc-pdf-applicant" style="display:none" onclick="removeDocPdf('applicant')">Remove & Use Generated Template</button>
      </div>
      <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
      <textarea id="doc-text-applicant" rows="8"></textarea>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="saveDocText('applicant')">Save Text</button>
        <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('applicant','Applicant Agreement Signature Placement')">Edit Signature Placement</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Store Agreement</h3>
      <p class="small-muted" id="doc-pdf-status-store">Checking…</p>
      <input type="file" id="doc-pdf-file-store" accept="application/pdf">
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="uploadDocPdf('store')">Upload PDF</button>
        <button class="btn btn-sm btn-outline" id="btn-remove-doc-pdf-store" style="display:none" onclick="removeDocPdf('store')">Remove & Use Generated Template</button>
      </div>
      <label style="margin-top:16px">Template Text <span class="small-muted">(used only if no PDF is uploaded above)</span></label>
      <textarea id="doc-text-store" rows="8"></textarea>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="saveDocText('store')">Save Text</button>
        <button class="btn btn-sm btn-outline" onclick="openSignatureBoxEditor('store','Store Agreement Signature Placement')">Edit Signature Placement</button>
      </div>
    </div>
  </div>

  <div id="panel-emails" style="display:none">
    <p class="small-muted">Edit the text of automatic system emails (contract ready, approvals, invites, password reset). <code>{{placeholders}}</code> get filled in with real values when each email actually sends — leave them as-is, just move them where you want.</p>
    <div id="email-templates-list">Loading…</div>
  </div>

  ${isSuperAdmin ? `
  <div id="panel-backups" style="display:none">
    <div class="card">
      <div class="flex-between"><h3 style="margin:0">Database Backups</h3><div class="pill-row">
        <button class="btn btn-sm btn-outline" onclick="downloadBackupNow()">Download Backup Now</button>
        <button class="btn btn-sm btn-primary" onclick="runBackupNow()">Run Backup</button>
      </div></div>
      <p class="small-muted">A full snapshot of the database is taken automatically every few hours (kept on this server's disk). "Run Backup" takes one immediately; "Download Backup Now" takes one and downloads it straight to your computer — the only copy that's off this server, so do this periodically and keep it somewhere safe.</p>
      <div id="backups-list" style="margin-top:14px">Loading…</div>
    </div>
  </div>` : ''}
`);

qsa('.tabs button').forEach(b => b.addEventListener('click', () => {
  qsa('.tabs button').forEach(x => x.classList.remove('active')); b.classList.add('active');
  ['org','seasons','fields','documents','emails','backups'].forEach(t => { const el = qs('#panel-'+t); if (el) el.style.display = t === b.dataset.t ? 'block' : 'none'; });
  if (b.dataset.t === 'emails') loadEmailTemplates();
  if (b.dataset.t === 'backups') loadBackups();
}));

async function loadOrg() {
  const { organization: o } = await api('/orgs/me');
  qs('#org-name').value = o.name || '';
  qs('#org-primary_color').value = o.primary_color || '#241a15';
  qs('#org-accent_color').value = o.accent_color || '#c9a76a';
  qs('#org-support_email').value = o.support_email || '';
  qs('#org-support_phone').value = o.support_phone || '';
  qs('#org-address').value = o.address || '';
}
async function loadZipRestriction() {
  const { settings } = await api('/settings');
  qs('#org-allowed_zips').value = settings.allowed_zip_codes || '';
}
window.saveZipRestriction = async () => {
  try { await api('/settings', { method: 'PUT', body: { allowed_zip_codes: qs('#org-allowed_zips').value } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
async function loadPopup() {
  const { settings } = await api('/settings');
  qs('#popup-enabled').checked = settings.homepage_popup_enabled === '1';
  qs('#popup-message').value = settings.homepage_popup_message || '';
}
window.savePopup = async () => {
  try { await api('/settings', { method: 'PUT', body: { homepage_popup_enabled: qs('#popup-enabled').checked ? '1' : '0', homepage_popup_message: qs('#popup-message').value } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};
window.downloadFullExport = () => downloadAuthed('/system-export', 'kipas-hair-bp-full-export.xlsx');
window.saveOrg = async () => {
  const body = {
    name: qs('#org-name').value, primary_color: qs('#org-primary_color').value, accent_color: qs('#org-accent_color').value,
    support_email: qs('#org-support_email').value, support_phone: qs('#org-support_phone').value, address: qs('#org-address').value,
  };
  try { await api('/orgs/me', { method: 'PUT', body }); toast('Saved'); } catch (err) { toast(err.message, true); }
};

const ALL_SHUL_FIELDS = ['name_en','name_he','address','city','state','zip','ruv_first_name','ruv_last_name','ruv_phone','ruv_address','gabai_first_name','gabai_last_name','gabai_cell','gabai_email','gabai_address'];
const ALL_APPLICANT_FIELDS = ['first_name','last_name','marital_status','home_phone','husband_cell','wife_cell','email','address','shul_id','preferred_contact_method','num_children','home_for_yomtov'];

async function loadSeasons() {
  const { seasons } = await api('/seasons');
  qs('#seasons-list').innerHTML = seasons.map(s => `<div class="card" style="margin-bottom:10px">
      <div class="flex-between"><input value="${esc(s.name)}" style="font-weight:600;max-width:320px" onchange="updateSeason('${s.id}',{name:this.value})">${s.is_active ? badge('active','active') : badge('inactive','rejected')}</div>
      <div class="grid-2" style="margin-top:10px">
        <div><label style="margin-top:0">Start Date</label><input type="date" value="${s.start_date||''}" onchange="updateSeason('${s.id}',{start_date:this.value})"></div>
        <div><label style="margin-top:0">End Date</label><input type="date" value="${s.end_date||''}" onchange="updateSeason('${s.id}',{end_date:this.value})"></div>
      </div>
      <div class="grid-2" style="margin-top:10px">
        <div><label style="margin-top:0">Default Card Amount</label><input type="number" step="0.01" value="${s.default_card_amount ?? 0}" onchange="updateSeason('${s.id}',{default_card_amount:+this.value})"></div>
        <div><label style="margin-top:0">Season Status</label>${s.is_active ? `<button class="btn btn-sm btn-outline" disabled>This is the active season</button>` : `<button class="btn btn-sm btn-outline" onclick="updateSeason('${s.id}',{is_active:true})">Set as Active Season</button>`}</div>
      </div>
      <div class="grid-2" style="margin-top:10px">
        <div><label style="margin-top:0">Max Accepted Applicants <span class="small-muted">(blank = unlimited)</span></label><input type="number" min="0" value="${s.max_accepted_applicants ?? ''}" placeholder="Unlimited" onchange="updateSeason('${s.id}',{max_accepted_applicants: this.value === '' ? null : +this.value})"></div>
        <div><label style="margin-top:0">Accepted So Far</label><div style="padding:9px 0">${s.accepted_count}${s.max_accepted_applicants != null ? ` of ${s.max_accepted_applicants} (${s.remaining} remaining)${s.is_full ? ' ' + badge('full','rejected') : ''}` : ' (no cap set)'}</div></div>
      </div>
      <div class="divider"></div>
      <button class="btn btn-sm btn-outline" onclick="openSeasonNotes('${s.id}','${esc(s.name).replace(/'/g,"\\'")}')">Notes</button>
    </div>`).join('') || '<p class="small-muted">No seasons yet.</p>';
}
window.updateSeason = async (id, body) => { try { await api(`/seasons/${id}`, { method: 'PUT', body }); toast('Saved'); loadSeasons(); } catch (err) { toast(err.message, true); } };
window.openSeasonNotes = async (id, name) => {
  try {
    const { notes } = await api(`/seasons/${id}/notes`);
    const body = `
      <div style="display:flex;gap:8px"><input id="new-season-note" placeholder="Add a note about this season…"><button class="btn btn-sm btn-primary" onclick="addSeasonNote('${id}','${name.replace(/'/g,"\\'")}')">Add</button></div>
      <div style="margin-top:14px">${notes.map(n => `<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div>${esc(n.note)}</div><div class="small-muted">${esc(n.first_name||'')} ${esc(n.last_name||'')} · ${fmtDateTime(n.created_at)}</div></div>`).join('') || '<p class="small-muted">No notes yet.</p>'}</div>
    `;
    openModal(`${name}: Notes`, body);
  } catch (err) { toast(err.message, true); }
};
window.addSeasonNote = async (id, name) => {
  const note = qs('#new-season-note').value.trim();
  if (!note) return;
  try { await api(`/seasons/${id}/notes`, { method: 'POST', body: { note } }); openSeasonNotes(id, name); } catch (err) { toast(err.message, true); }
};
window.openNewSeason = () => {
  const body = `<label>Season Name *</label><input id="s-name" placeholder="e.g. 5787 / 2026-27"><label>Default Card Amount</label><input id="s-amount" type="number" step="0.01" value="0">
    <label>Max Accepted Applicants <span class="small-muted">(blank = unlimited)</span></label><input id="s-cap" type="number" min="0" placeholder="Unlimited">`;
  openModal('New Season', body, `<button class="btn btn-primary btn-sm" onclick="createSeason()">Create</button>`);
};
window.createSeason = async () => {
  const cap = qs('#s-cap').value;
  try { await api('/seasons', { method: 'POST', body: { name: qs('#s-name').value, default_card_amount: +qs('#s-amount').value, max_accepted_applicants: cap === '' ? null : +cap } }); closeModal(); loadSeasons(); } catch (err) { toast(err.message, true); }
};

async function loadFields() {
  const [{ fields: shulFields }, { fields: appFields }] = await Promise.all([api('/settings/fields/shul'), api('/settings/fields/applicant')]);
  renderFieldEditor('fields-shul', ALL_SHUL_FIELDS, shulFields);
  renderFieldEditor('fields-applicant', ALL_APPLICANT_FIELDS, appFields);
}
function renderFieldEditor(containerId, allFields, saved) {
  const map = Object.fromEntries(saved.map(f => [f.field_key, f]));
  qs('#'+containerId).innerHTML = `<table><thead><tr><th>Field</th><th>Required</th><th>Admin Override</th><th>Visible</th></tr></thead><tbody>
    ${allFields.map(f => { const s = map[f] || { is_required:0, is_admin_override:0, is_visible:1 };
      return `<tr data-field="${f}"><td>${f}</td>
        <td><input type="checkbox" class="fr-required" ${s.is_required?'checked':''}></td>
        <td><input type="checkbox" class="fr-override" ${s.is_admin_override?'checked':''}></td>
        <td><input type="checkbox" class="fr-visible" ${s.is_visible?'checked':''}></td></tr>`; }).join('')}
  </tbody></table>`;
}
window.saveFields = async (type) => {
  const containerId = type === 'shul' ? 'fields-shul' : 'fields-applicant';
  const fields = qsa(`#${containerId} tr[data-field]`).map(tr => ({
    field_key: tr.dataset.field, is_required: tr.querySelector('.fr-required').checked,
    is_admin_override: tr.querySelector('.fr-override').checked, is_visible: tr.querySelector('.fr-visible').checked,
  }));
  try { await api(`/settings/fields/${type}`, { method: 'PUT', body: { fields } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};

async function loadContractText() {
  const { settings } = await api('/settings');
  qs('#contract-text').value = settings.contract_template_text || '';
}
window.saveContractText = async () => { try { await api('/settings', { method: 'PUT', body: { contract_template_text: qs('#contract-text').value } }); toast('Saved'); } catch (err) { toast(err.message, true); } };

async function loadContractPdfStatus() {
  const { hasCustomTemplate } = await api('/settings/contract-pdf');
  qs('#pdf-status').innerHTML = hasCustomTemplate
    ? '<strong style="color:var(--success)">A custom contract PDF is currently in use.</strong>'
    : 'No custom PDF uploaded. Using the generated text template below.';
  qs('#btn-remove-pdf').style.display = hasCustomTemplate ? 'inline-flex' : 'none';
}
window.uploadContractPdf = async () => {
  const file = qs('#contract-pdf-file').files[0];
  if (!file) return toast('Choose a PDF file first', true);
  const fd = new FormData(); fd.append('file', file);
  try { await api('/settings/contract-pdf', { method: 'POST', isForm: true, body: fd }); toast('Contract PDF uploaded'); loadContractPdfStatus(); } catch (err) { toast(err.message, true); }
};
window.removeContractPdf = async () => {
  if (!confirm('Remove the custom PDF and go back to the generated text template?')) return;
  try { await api('/settings/contract-pdf', { method: 'DELETE' }); toast('Removed'); loadContractPdfStatus(); } catch (err) { toast(err.message, true); }
};

async function loadDocPdfStatus(entityType) {
  const { hasCustomTemplate } = await api(`/settings/document-pdf/${entityType}`);
  qs(`#doc-pdf-status-${entityType}`).innerHTML = hasCustomTemplate
    ? '<strong style="color:var(--success)">A custom PDF is currently in use.</strong>'
    : 'No custom PDF uploaded. Using the generated text template below.';
  qs(`#btn-remove-doc-pdf-${entityType}`).style.display = hasCustomTemplate ? 'inline-flex' : 'none';
}
window.uploadDocPdf = async (entityType) => {
  const file = qs(`#doc-pdf-file-${entityType}`).files[0];
  if (!file) return toast('Choose a PDF file first', true);
  const fd = new FormData(); fd.append('file', file);
  try { await api(`/settings/document-pdf/${entityType}`, { method: 'POST', isForm: true, body: fd }); toast('PDF uploaded'); loadDocPdfStatus(entityType); } catch (err) { toast(err.message, true); }
};
window.removeDocPdf = async (entityType) => {
  if (!confirm('Remove the custom PDF and go back to the generated text template?')) return;
  try { await api(`/settings/document-pdf/${entityType}`, { method: 'DELETE' }); toast('Removed'); loadDocPdfStatus(entityType); } catch (err) { toast(err.message, true); }
};
async function loadDocText(entityType) {
  const { settings } = await api('/settings');
  qs(`#doc-text-${entityType}`).value = settings[`document_template_text_${entityType}`] || '';
}
window.saveDocText = async (entityType) => {
  try { await api('/settings', { method: 'PUT', body: { [`document_template_text_${entityType}`]: qs(`#doc-text-${entityType}`).value } }); toast('Saved'); } catch (err) { toast(err.message, true); }
};

async function loadEmailTemplates() {
  const { templates } = await api('/settings/email-templates');
  qs('#email-templates-list').innerHTML = templates.map(t => `<div class="card" style="margin-bottom:10px">
      <div class="flex-between">
        <strong>${esc(t.label)}</strong>
        ${t.isCustomized ? badge('customized', 'active') : badge('default', 'inactive')}
      </div>
      <p class="small-muted" style="margin-top:6px">Available: ${t.vars.map(v => `<code>{{${esc(v)}}}</code>`).join(' ')}</p>
      <button class="btn btn-sm btn-outline" onclick="openEditEmailTemplate('${t.key}')">Edit</button>
      ${t.isCustomized ? `<button class="btn btn-sm btn-outline" onclick="resetEmailTemplate('${t.key}')">Reset to Default</button>` : ''}
    </div>`).join('');
  emailTemplatesCache = templates;
}
let emailTemplatesCache = [];
window.openEditEmailTemplate = (key) => {
  const t = emailTemplatesCache.find(x => x.key === key);
  if (!t) return;
  const body = `
    <label>Subject</label><input id="et-subject" value="${esc(t.subject)}">
    <label>Body (HTML)</label><textarea id="et-body" rows="10">${esc(t.body)}</textarea>
    <p class="small-muted" style="margin-top:10px">Available placeholders: ${t.vars.map(v => `<code>{{${esc(v)}}}</code>`).join(' ')}</p>
  `;
  openModal(t.label, body, `<button class="btn btn-primary btn-sm" onclick="saveEmailTemplate('${key}')">Save</button>`);
};
window.saveEmailTemplate = async (key) => {
  const body = { subject: qs('#et-subject').value, body: qs('#et-body').value };
  try { await api(`/settings/email-templates/${key}`, { method: 'PUT', body }); toast('Saved'); closeModal(); loadEmailTemplates(); } catch (err) { toast(err.message, true); }
};
window.resetEmailTemplate = async (key) => {
  if (!confirm('Revert this email to the built-in default text?')) return;
  try { await api(`/settings/email-templates/${key}`, { method: 'DELETE' }); toast('Reset'); loadEmailTemplates(); } catch (err) { toast(err.message, true); }
};

function fmtBytes(n) { if (n < 1024) return n + ' B'; if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB'; return (n/(1024*1024)).toFixed(1) + ' MB'; }
async function loadBackups() {
  if (!isSuperAdmin) return;
  const { backups } = await api('/settings/backups');
  qs('#backups-list').innerHTML = backups.length ? `<table><thead><tr><th>Created</th><th>Size</th><th></th></tr></thead><tbody>
      ${backups.map(b => `<tr><td>${fmtDateTime(b.createdAt)}</td><td>${fmtBytes(b.sizeBytes)}</td>
        <td><button class="btn btn-sm btn-outline" onclick="downloadAuthed('/settings/backups/${encodeURIComponent(b.filename)}/download','${esc(b.filename)}')">Download</button></td></tr>`).join('')}
    </tbody></table>` : '<p class="small-muted">No backups yet — the first automatic one runs shortly after this server started.</p>';
}
window.runBackupNow = async () => {
  try { await api('/settings/backups/run', { method: 'POST' }); toast('Backup created'); loadBackups(); } catch (err) { toast(err.message, true); }
};
window.downloadBackupNow = () => downloadAuthed('/settings/backups/download-now', `ecards-backup-${Date.now()}.sqlite`);

loadOrg(); loadZipRestriction(); loadPopup(); loadSeasons(); loadFields(); loadContractText(); loadContractPdfStatus();
loadDocPdfStatus('applicant'); loadDocPdfStatus('store'); loadDocText('applicant'); loadDocText('store');
</script>
</body>
</html>
