<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users & Permissions · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAuth();
const RESOURCES = ['dashboard','shuls','applicants','cards','stores','forms','users','settings'];
const HIDABLE_FIELDS = {
  shuls: ['name_en','name_he','address','ruv_first_name','ruv_last_name','ruv_phone','gabai_first_name','gabai_last_name','gabai_cell','gabai_email'],
  applicants: ['first_name','last_name','home_phone','husband_cell','wife_cell','email','address','card_amount','comments'],
};

renderShell('/admin/users.html', `
  <div class="flex-between"><h2>Users & Permissions</h2><button class="btn btn-primary btn-sm" id="btn-new">+ Invite User</button></div>
  <p class="small-muted">Control which pages each internal user can see, whether they can edit/export, and which individual fields (e.g. applicant names) are hidden from them.</p>
  <div class="card" style="padding:0;overflow-x:auto">
    <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
    <tbody id="tbody"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody></table>
  </div>
`);

async function load() {
  try {
    const { users } = await api('/users');
    qs('#tbody').innerHTML = users.map(u => `<tr>
      <td>${esc(u.first_name)} ${esc(u.last_name)}</td><td>${esc(u.email)}</td><td style="text-transform:capitalize">${esc(u.role.replace('_',' '))}</td>
      <td>${u.is_paused ? badge('paused','paused') : (u.is_active ? badge('active','active') : badge('inactive','rejected'))}</td>
      <td><button class="btn btn-sm btn-outline" onclick="openUser('${u.id}')">Manage</button></td>
    </tr>`).join('');
  } catch (err) { toast(err.message, true); }
}

function permRow(resource, p) {
  const fields = HIDABLE_FIELDS[resource];
  return `<div class="card" style="margin-bottom:10px" data-resource="${resource}">
    <div class="flex-between"><strong style="text-transform:capitalize">${resource}</strong>
      <div class="pill-row">
        <label class="checkbox-row"><input type="checkbox" class="p-view" ${p.can_view?'checked':''}>View</label>
        <label class="checkbox-row"><input type="checkbox" class="p-edit" ${p.can_edit?'checked':''}>Edit</label>
        <label class="checkbox-row"><input type="checkbox" class="p-export" ${p.can_export?'checked':''}>Export</label>
      </div>
    </div>
    <label style="margin-top:10px">Scope</label>
    <select class="p-scope"><option value="all" ${p.scope==='all'?'selected':''}>All records</option><option value="assigned" ${p.scope==='assigned'?'selected':''}>Only assigned records</option></select>
    ${fields ? `<label>Hidden Fields (invisible to this user)</label><div class="pill-row">${fields.map(f => `<label class="checkbox-row"><input type="checkbox" class="p-hide" value="${f}" ${p.hidden_fields.includes(f)?'checked':''}>${f}</label>`).join('')}</div>` : ''}
  </div>`;
}

async function openUser(id) {
  try {
    const { user: u, permissions } = await api(`/users/${id}`);
    const permMap = Object.fromEntries(permissions.map(p => [p.resource, p]));
    const defaultPerm = { can_view: 1, can_edit: 0, can_export: 0, scope: 'all', hidden_fields: [] };
    const body = `
      <div class="grid-2">
        <div><label>First Name</label><input id="e-first_name" value="${esc(u.first_name||'')}"></div>
        <div><label>Last Name</label><input id="e-last_name" value="${esc(u.last_name||'')}"></div>
      </div>
      <label>Phone <span class="small-muted">(used for SMS Center sends)</span></label><input id="e-phone" value="${esc(u.phone||'')}">
      <label>Role</label>
      <select id="e-role"><option value="staff" ${u.role==='staff'?'selected':''}>Staff (limited)</option><option value="org_admin" ${u.role==='org_admin'?'selected':''}>Org Admin (full)</option><option value="super_admin" ${u.role==='super_admin'?'selected':''}>Super Admin</option></select>
      <div class="checkbox-row" style="margin-top:12px"><input type="checkbox" id="e-active" ${u.is_active?'checked':''}><label style="margin:0">Active</label></div>
      <div class="divider"></div>
      <h4>Page & Field Permissions</h4>
      ${RESOURCES.map(r => permRow(r, permMap[r] || defaultPerm)).join('')}
    `;
    openModal(`${u.first_name} ${u.last_name}`, body, `<button class="btn btn-danger btn-sm" onclick="deleteUserPermanently('${id}')">Delete Permanently</button><button class="btn btn-outline btn-sm" onclick="deactivateUser('${id}')">Deactivate</button><button class="btn btn-primary btn-sm" onclick="saveUser('${id}')">Save</button>`);
  } catch (err) { toast(err.message, true); }
}

window.saveUser = async (id) => {
  const permissions = qsa('[data-resource]').map(el => ({
    resource: el.dataset.resource,
    can_view: el.querySelector('.p-view').checked,
    can_edit: el.querySelector('.p-edit').checked,
    can_export: el.querySelector('.p-export').checked,
    scope: el.querySelector('.p-scope').value,
    hidden_fields: Array.from(el.querySelectorAll('.p-hide:checked')).map(c => c.value),
  }));
  const body = { first_name: qs('#e-first_name').value, last_name: qs('#e-last_name').value, phone: qs('#e-phone').value, role: qs('#e-role').value, is_active: qs('#e-active').checked, permissions };
  try { await api(`/users/${id}`, { method: 'PUT', body }); toast('Saved'); closeModal(); load(); } catch (err) { toast(err.message, true); }
};
window.deactivateUser = async (id) => { if (!confirm('Deactivate this user? They will be blocked from signing in, but their account and history stay on file.')) return; try { await api(`/users/${id}`, { method: 'DELETE' }); closeModal(); load(); } catch (err) { toast(err.message, true); } };
window.deleteUserPermanently = async (id) => {
  if (!confirm('Permanently delete this user? This cannot be undone. Their notes/sent emails/tasks stay on file, but the account itself is gone.')) return;
  try { await api(`/users/${id}/permanent`, { method: 'DELETE' }); toast('User deleted'); closeModal(); load(); } catch (err) { toast(err.message, true); }
};

qs('#btn-new').addEventListener('click', () => {
  const body = `<label>Email *</label><input id="n-email" type="email"><label>First Name *</label><input id="n-first_name"><label>Last Name</label><input id="n-last_name">
    <label>Phone <span class="small-muted">(used for SMS Center sends)</span></label><input id="n-phone">
    <label>Role</label><select id="n-role"><option value="staff">Staff (limited)</option><option value="org_admin">Org Admin (full)</option></select>`;
  openModal('Invite User', body, `<button class="btn btn-primary btn-sm" onclick="createUser()">Send Invite</button>`);
});
window.createUser = async () => {
  const body = { email: qs('#n-email').value, first_name: qs('#n-first_name').value, last_name: qs('#n-last_name').value, phone: qs('#n-phone').value, role: qs('#n-role').value };
  try { const r = await api('/users', { method: 'POST', body }); toast(r.emailError ? `User created, but invite email failed: ${r.emailError}` : 'Invite sent', !!r.emailError); closeModal(); load(); } catch (err) { toast(err.message, true); }
};

load();
</script>
</body>
</html>
