<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Builder · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAdmin();
renderShell('/admin/forms', `
  <div class="flex-between"><h2>Form Builder</h2><button class="btn btn-primary btn-sm" id="btn-new">+ New Form</button></div>
  <p class="small-muted">Build custom forms and set them public, limited to a group of shuls, or a single shul/applicant.</p>
  <div id="forms-list"></div>
`);

let fieldDraft = [];
let formsCache = [];
let seasonsCache = [];

const SECTION_PAGE = { shul_application: '/apply', store_application: '/apply-store', applicant_application: '/apply-ezras-habayis' };
const SECTION_LABEL = { shul_application: 'Shul Application', store_application: 'Store Application', applicant_application: 'Applicant Application' };
// The section's fixed public page always goes to whichever form is
// currently the default for its type — Preview Link goes there when this
// form IS that one; otherwise there's no live URL to preview yet (it would
// only take effect after "Set as Default"), so it falls back to the
// generic slug-driven form renderer instead.
function previewLink(f) { return (f.is_current_default && SECTION_PAGE[f.type]) || '/form?slug=' + esc(f.slug); }
function scheduleStatus(f) {
  const now = new Date();
  if (!f.is_active) return badge('inactive', 'rejected');
  if (f.opens_at && now < new Date(f.opens_at)) return badge(`opens ${fmtDate(f.opens_at)}`, 'pending');
  if (f.closes_at && now > new Date(f.closes_at)) return badge('closed', 'rejected');
  return badge('open now', 'active');
}

async function load() {
  const [{ forms }, { seasons }] = await Promise.all([api('/forms'), api('/seasons')]);
  formsCache = forms;
  seasonsCache = seasons;
  const seasonName = (id) => seasons.find(s => s.id === id)?.name || 'no season';
  qs('#forms-list').innerHTML = forms.length ? forms.map(f => `<div class="card" style="margin-bottom:12px">
      <div class="flex-between">
        <div><strong>${esc(f.name)}</strong> ${f.is_current_default ? badge(`live for ${esc(SECTION_LABEL[f.type]||f.type)}`, 'active') : ''} <span class="small-muted">/${esc(f.slug)}</span><br>
          <span class="small-muted">${esc(f.type)} · ${esc(f.visibility)} · ${esc(seasonName(f.season_id))} · ${f.schema_json.length} field(s)${f.opens_at ? ` · opens ${fmtDate(f.opens_at)}` : ''}${f.closes_at ? ` · closes ${fmtDate(f.closes_at)}` : ''}</span></div>
        <div class="pill-row">
          ${scheduleStatus(f)}
          <a class="btn btn-sm btn-outline" href="${previewLink(f)}" target="_blank">Preview Link</a>
          <button class="btn btn-sm btn-outline" onclick="openEditForm('${f.id}')">Edit</button>
          ${!f.is_current_default ? `<button class="btn btn-sm btn-outline" onclick="setDefaultForm('${f.id}')">Set as Default for ${esc(SECTION_LABEL[f.type]||f.type)}</button>` : ''}
          <button class="btn btn-sm btn-outline" onclick="toggleForm('${f.id}', ${f.is_active ? 'false' : 'true'})">${f.is_active ? 'Deactivate' : 'Activate'}</button>
        </div>
      </div>
    </div>`).join('') : '<p class="small-muted">No forms yet.</p>';
}
window.toggleForm = async (id, activate) => { try { await api(`/forms/${id}`, { method: 'PUT', body: { is_active: activate === 'true' } }); load(); } catch (err) { toast(err.message, true); } };
window.setDefaultForm = async (id) => {
  if (!confirm(`Make this the live form for its section? The public page will immediately start using it instead of whichever form serves that section now.`)) return;
  try { await api(`/forms/${id}/set-default`, { method: 'PUT' }); toast('This is now the live form for its section'); load(); } catch (err) { toast(err.message, true); }
};

qs('#btn-new').addEventListener('click', () => {
  fieldDraft = [{ key: 'first_name', label: 'First Name', type: 'text', required: true }];
  openModal('New Form', formBody(), `<button class="btn btn-primary btn-sm" onclick="createForm()">Create Form</button>`);
  renderFields();
});

window.openEditForm = (id) => {
  const f = formsCache.find(x => x.id === id);
  if (!f) return;
  fieldDraft = JSON.parse(JSON.stringify(f.schema_json));
  openModal('Edit Form', formBody({ ...f, editing: true }), `<button class="btn btn-primary btn-sm" onclick="saveEditForm('${id}')">Save</button>`);
  renderFields();
};
window.saveEditForm = async (id) => {
  // datetime-local inputs give wall-clock time with no timezone — resolve
  // against the browser's own timezone into a real UTC instant before
  // sending, since the server (a different timezone on Render) compares
  // opens_at/closes_at as absolute instants, not wall-clock strings.
  const opensVal = qs('#f-opens').value, closesVal = qs('#f-closes').value;
  const body = {
    name: qs('#f-name').value, visibility: qs('#f-visibility').value, schema: fieldDraft, season_id: qs('#f-season').value, slug: qs('#f-slug').value,
    opens_at: opensVal ? new Date(opensVal).toISOString() : null, closes_at: closesVal ? new Date(closesVal).toISOString() : null,
  };
  try { await api(`/forms/${id}`, { method: 'PUT', body }); toast('Saved'); closeModal(); load(); } catch (err) { toast(err.message, true); }
};

function toLocalInputValue(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }

function formBody(existing = null) {
  return `
    <label>Form Name *</label><input id="f-name" value="${existing ? esc(existing.name) : ''}">
    <div class="grid-2">
      <div><label>Type</label>${existing?.editing
        ? `<input value="${esc(SECTION_LABEL[existing.type] || existing.type)}" disabled>`
        : `<select id="f-type"><option value="shul_application">Shul Application</option><option value="store_application">Store Application</option><option value="applicant_application">Applicant Application</option></select>`}
      </div>
      <div><label>Visibility</label><select id="f-visibility"><option value="public" ${existing?.visibility==='public'?'selected':''}>Public (anyone with the link)</option><option value="group" ${existing?.visibility==='group'?'selected':''}>Group of Shuls</option><option value="individual" ${existing?.visibility==='individual'?'selected':''}>Individual Shul</option></select></div>
    </div>
    <label>Season *</label><select id="f-season">${seasonsCache.map(s => `<option value="${s.id}" ${(existing ? existing.season_id === s.id : s.is_active) ? 'selected' : ''}>${esc(s.name)}${s.is_active?' (active)':''}</option>`).join('')}</select>
    <label>URL Slug *</label><input id="f-slug" placeholder="e.g. shul-registration-2026" value="${existing ? esc(existing.slug) : ''}">
    ${existing?.editing && existing.is_current_default && SECTION_PAGE[existing.type] ? `<p class="small-muted">This form is live at <code>${esc(SECTION_PAGE[existing.type])}</code> — that URL is fixed regardless of this slug; renaming it here won't move or break the live page.</p>` : ''}
    ${existing?.editing ? `
    <div class="grid-2">
      <div><label>Opens <span class="small-muted">(blank = always open)</span></label><input type="datetime-local" id="f-opens" value="${toLocalInputValue(existing.opens_at)}"></div>
      <div><label>Closes <span class="small-muted">(blank = never closes)</span></label><input type="datetime-local" id="f-closes" value="${toLocalInputValue(existing.closes_at)}"></div>
    </div>` : ''}
    <div class="divider"></div>
    <div class="flex-between"><h4 style="margin:0">Fields</h4><button type="button" class="btn btn-sm btn-outline" onclick="addField()">+ Add Field</button></div>
    <div id="field-list"></div>
  `;
}
// 'header' and 'image' are presentational blocks, not real inputs — no Field
// Key (nothing to submit under), no Required (nothing to require). They
// still live in the same schema array/order as real fields, so an admin can
// interleave section headings and images between groups of fields.
const BLOCK_TYPES = ['header', 'image'];
function renderFields() {
  qs('#field-list').innerHTML = fieldDraft.map((f, i) => {
    const isBlock = BLOCK_TYPES.includes(f.type);
    const isImage = f.type === 'image';
    return `<div class="card" style="margin:8px 0;padding:12px">
      <div class="grid-2">
        ${isBlock ? '' : `<div><label style="margin-top:0">Field Key</label><input value="${esc(f.key)}" onchange="fieldDraft[${i}].key=this.value"></div>`}
        <div style="${isBlock ? 'grid-column:1/-1' : ''}"><label style="margin-top:0">${isImage ? 'Alt Text' : 'Label'}</label><input value="${esc(f.label)}" onchange="fieldDraft[${i}].label=this.value"></div>
      </div>
      <div class="grid-2">
        <div><label style="margin-top:0">Type</label><select onchange="fieldDraft[${i}].type=this.value; renderFields()">
          ${['text','email','tel','number','textarea','checkbox','select','header','image'].map(t => `<option ${f.type===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
        ${isBlock ? '' : `<div><label style="margin-top:0">Required</label><select onchange="fieldDraft[${i}].required=this.value==='1'"><option value="1" ${f.required?'selected':''}>Yes</option><option value="0" ${!f.required?'selected':''}>No</option></select></div>`}
      </div>
      ${isImage ? `<div style="margin-top:8px">
        <input type="file" accept="image/*" onchange="uploadFieldImage(${i}, this)">
        ${f.url ? `<img src="${esc(f.url)}" style="max-width:200px;max-height:120px;display:block;margin-top:8px;border-radius:6px">` : '<p class="small-muted">No image uploaded yet.</p>'}
      </div>` : ''}
      <button type="button" class="btn btn-sm btn-outline" style="margin-top:6px" onclick="removeField(${i})">Remove</button>
    </div>`;
  }).join('');
}
window.addField = () => { fieldDraft.push({ key: '', label: '', type: 'text', required: false }); renderFields(); };
window.removeField = (i) => { fieldDraft.splice(i, 1); renderFields(); };
window.uploadFieldImage = async (i, input) => {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData(); fd.append('image', file);
  try {
    const { url } = await api('/forms/upload-image', { method: 'POST', isForm: true, body: fd });
    fieldDraft[i].url = url;
    renderFields();
    toast('Image uploaded');
  } catch (err) { toast(err.message, true); }
};

window.createForm = async () => {
  const body = { name: qs('#f-name').value, type: qs('#f-type').value, visibility: qs('#f-visibility').value, slug: qs('#f-slug').value, schema: fieldDraft, season_id: qs('#f-season').value };
  try { await api('/forms', { method: 'POST', body }); toast('Form created'); closeModal(); load(); } catch (err) { toast(err.message, true); }
};

load();
</script>
</body>
</html>
