<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent Actions · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireRole('super_admin');
renderShell('/admin/audit.html', `
  <div class="flex-between">
    <h2>Recent Actions</h2>
    <select id="f-hours">
      <option value="24">Last 24 hours</option>
      <option value="48" selected>Last 48 hours</option>
      <option value="168">Last 7 days</option>
    </select>
  </div>
  <p class="small-muted">Every create/update/approve/reject across the system, who did it, and what changed. Undoing restores exactly the fields that action changed; undoing an undo is how you redo.</p>
  <div id="actions-list">Loading…</div>
`);

const FIELD_LABELS = { approval_status: 'Status', card_amount: 'Card Amount', is_active: 'Active', first_name: 'First Name', last_name: 'Last Name',
  name_en: 'Name', name: 'Name', role: 'Role', phone: 'Phone', slots_allocated: 'Slots' };
function fieldLabel(k) { return FIELD_LABELS[k] || k; }
function fmtVal(v) { if (v === null || v === undefined) return '(empty)'; if (v === 1 && typeof v === 'number') return 'Yes'; if (v === 0 && typeof v === 'number') return 'No'; return String(v); }

// Summarizes what an action actually changed by diffing before/after key by
// key — for a 'create' (before=null) or 'delete' (after=null) this just
// lists the row's fields directly instead of a diff.
function describeChange(a) {
  if (a.action === 'create') return `Created ${a.entity_type}${a.after ? ': ' + (a.after.name_en || a.after.name || `${a.after.first_name||''} ${a.after.last_name||''}`.trim() || a.after.email || a.entity_id) : ''}`;
  if (a.action === 'delete') return `Deleted ${a.entity_type}${a.before ? ': ' + (a.before.name_en || a.before.name || `${a.before.first_name||''} ${a.before.last_name||''}`.trim() || a.before.email || a.entity_id) : ''}`;
  const before = a.before || {}, after = a.after || {};
  const keys = [...new Set([...Object.keys(before), ...Object.keys(after)])].filter(k => JSON.stringify(before[k]) !== JSON.stringify(after[k]));
  if (!keys.length) return `${a.action} on ${a.entity_type}`;
  return keys.map(k => `${fieldLabel(k)}: ${esc(fmtVal(before[k]))} → ${esc(fmtVal(after[k]))}`).join(', ');
}

async function load() {
  const hours = qs('#f-hours').value;
  const { actions } = await api(`/audit/recent?hours=${hours}`);
  qs('#actions-list').innerHTML = actions.length ? actions.map(a => `<div class="card" style="margin-bottom:8px;padding:14px 16px">
      <div class="flex-between">
        <div>
          <strong style="text-transform:capitalize">${esc(a.action)}</strong> · <span class="small-muted" style="text-transform:capitalize">${esc(a.entity_type)}</span>
          <div style="margin-top:4px">${describeChange(a)}</div>
          <div class="small-muted" style="margin-top:6px">${a.user_id ? esc((a.first_name||'')+' '+(a.last_name||'')).trim() || esc(a.user_email) : 'System'} · ${fmtDateTime(a.created_at)}${a.undone_at ? ' · ' + badge('undone','inactive') : ''}</div>
        </div>
        ${a.undoable ? `<button class="btn btn-sm btn-outline" onclick="undoAction('${a.id}')">Undo</button>` : ''}
      </div>
    </div>`).join('') : '<p class="small-muted">No actions in this window.</p>';
}
window.undoAction = async (id) => {
  if (!confirm('Undo this action? This restores the affected record to how it was right before this change.')) return;
  try { await api(`/audit/${id}/undo`, { method: 'POST' }); toast('Undone'); load(); } catch (err) { toast(err.message, true); }
};
qs('#f-hours').addEventListener('change', load);
load();
</script>
</body>
</html>
