<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk Upload · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireRole('shul');
renderShell('/shul-portal/upload', `
  <h2>Bulk Upload Applicants</h2>
  <div class="card">
    <p class="small-muted">Download the template, fill it in (Excel .xlsx only — CSV isn't accepted, since it doesn't reliably support Hebrew text), then upload. You don't need to include a shul column: applicants are automatically assigned to your shul.</p>
    <button class="btn btn-outline btn-sm" onclick="downloadAuthed('/applicants/import/template','applicant_import_template.xlsx')">Download Template</button>
    <div class="divider"></div>
    <input type="file" id="import-file" accept=".xlsx">
    <div style="margin-top:14px"><button class="btn btn-primary btn-sm" id="btn-run-import" onclick="runImport()">Upload</button></div>
    <div id="import-result" style="margin-top:16px"></div>
  </div>
`);
window.runImport = async () => {
  const btn = qs('#btn-run-import');
  if (btn.disabled) return;
  const file = qs('#import-file').files[0];
  if (!file) return toast('Choose a file first', true);
  const fd = new FormData(); fd.append('file', file);
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const r = await api('/applicants/import', { method: 'POST', isForm: true, body: fd });
    qs('#import-result').innerHTML = `<p><strong>${r.success}</strong> submitted, <strong>${r.duplicates}</strong> flagged as duplicates, <strong>${r.errors.length}</strong> errors.</p>` +
      (r.errors.length ? `<ul>${r.errors.slice(0,20).map(e=>`<li>Row ${e.row}: ${esc(e.error)}</li>`).join('')}</ul>` : '');
  } catch (err) { toast(err.message, true); } finally {
    btn.disabled = false; btn.textContent = 'Upload';
  }
};
</script>
</body>
</html>
