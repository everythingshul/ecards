<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application Form — everythingshul</title>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div class="public-wrap">
  <div class="public-header"><div class="dot"><span>&#9670;</span></div><h1 id="form-title">Application</h1></div>
  <form id="dyn-form" class="card"></form>
  <div class="card" id="done-section" style="display:none;text-align:center"><h3>&#10003; Submitted</h3><p class="small-muted">Thank you — your submission has been received.</p></div>
</div>
<script src="/js/app.js"></script>
<script>renderPublicFooter();</script>
<script>
const slug = new URLSearchParams(location.search).get('slug');
let shulOptions = [];

(async () => {
  if (!slug) { qs('#dyn-form').innerHTML = '<p>No form specified.</p>'; return; }
  try {
    const [{ form }, { shuls }] = await Promise.all([api(`/forms/public/${slug}`), api('/shuls/public/list')]);
    shulOptions = shuls;
    qs('#form-title').textContent = form.name;
    qs('#dyn-form').innerHTML = form.schema_json.map(fieldHtml).join('') + `<div style="margin-top:22px;text-align:right"><button class="btn btn-primary">Submit</button></div>`;
  } catch (err) {
    qs('#dyn-form').innerHTML = `<p>${esc(err.message)}</p>`;
  }
})();

function fieldHtml(f) {
  const req = f.required ? 'required' : '';
  const label = `<label>${esc(f.label || f.key)} ${f.required ? '<span class="req">*</span>' : ''}</label>`;
  if (f.key === 'shul_id') return `${label}<select name="shul_id" ${req}><option value="">Select your shul…</option>${shulOptions.map(s => `<option value="${s.id}">${esc(s.name_en)}</option>`).join('')}</select>`;
  if (f.type === 'textarea') return `${label}<textarea name="${esc(f.key)}" ${req}></textarea>`;
  if (f.type === 'checkbox') return `<div class="checkbox-row" style="margin-top:14px"><input type="checkbox" name="${esc(f.key)}" id="fld-${esc(f.key)}"><label style="margin:0" for="fld-${esc(f.key)}">${esc(f.label||f.key)}</label></div>`;
  return `${label}<input type="${f.type==='number'?'number':(f.type==='email'?'email':(f.type==='tel'?'tel':'text'))}" name="${esc(f.key)}" ${req}>`;
}

qs('#dyn-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {};
  for (const [k, v] of fd.entries()) body[k] = v;
  qsa('input[type=checkbox]', e.target).forEach(c => body[c.name] = c.checked);
  try {
    await api(`/forms/public/${slug}/submit`, { method: 'POST', body });
    qs('#dyn-form').style.display = 'none';
    qs('#done-section').style.display = 'block';
  } catch (err) { toast(err.message, true); }
});
</script>
</body>
</html>
