<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — everythingshul</title>
<link rel="stylesheet" href="/css/theme.css">
<style>body { background: var(--brand-bg); display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { width: 380px; } .login-box h1 { color:#fdf7ea; text-align:center; font-size: 20px; }</style>
</head>
<body>
<div class="login-box">
  <h1>Choose a New Password</h1>
  <div class="card">
    <form id="form">
      <label>New Password (min 8 characters)</label><input type="password" id="password" required minlength="8">
      <label>Confirm Password</label><input type="password" id="confirm" required minlength="8">
      <div style="margin-top:20px"><button class="btn btn-primary" style="width:100%">Update Password</button></div>
    </form>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
qs('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (qs('#password').value !== qs('#confirm').value) return toast('Passwords do not match', true);
  try {
    const { token: authToken, user } = await api('/auth/accept-invite', { method: 'POST', body: { token, password: qs('#password').value } });
    Auth.set(authToken, user);
    toast('Password updated');
    location.href = user.role === 'shul' ? '/shul-portal/dashboard.html' : (user.role === 'store' ? '/store-portal/dashboard.html' : '/admin/dashboard.html');
  } catch (err) { toast(err.message, true); }
});
</script>
</body>
</html>
