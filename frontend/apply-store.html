<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Application · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body>
<div class="public-wrap">
  <div class="public-header">
    <img class="brand-mark" src="/img/org-logo.png" alt="Organization logo">
    <h1>Store Application</h1>
    <p class="small-muted">Apply to become a participating gift card location. Our team will review your application and follow up on next steps.</p>
  </div>

  <form id="apply-form" class="card">
    <div id="dyn-fields"><p class="small-muted">Loading…</p></div>
    <div style="margin-top:26px;text-align:right">
      <button type="submit" class="btn btn-primary" id="submit-btn">Submit Application</button>
    </div>
  </form>

  <div class="card" id="done-section" style="display:none;text-align:center">
    <h3>&#10003; Application Submitted</h3>
    <p class="small-muted" id="done-message"></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>trackPageview();</script>
<script>renderPublicFooter();</script>
<script>
// Fixed question set for Store Application (utils/builtinSchemas.js) — no
// longer editable through Form Builder.
// Manager fields are wrapped in their own div so the same_person checkbox
// can hide them (and drop their `required`) without touching the shared
// fieldHtml renderer — server-side validation (formValidation.js's
// requiredUnless) is the real enforcement; this is just so the form doesn't
// visually ask for info it won't actually require.
const MANAGER_KEYS = ['manager_name', 'manager_phone', 'manager_email'];
(async () => {
  const schema = await loadBuiltinSchema('store_application');
  if (!schema) { qs('#dyn-fields').innerHTML = '<p class="small-muted">This form isn\'t available right now — please try again shortly.</p>'; return; }
  const managerFields = schema.filter(f => MANAGER_KEYS.includes(f.key));
  const otherFields = schema.filter(f => !MANAGER_KEYS.includes(f.key));
  const sameIdx = otherFields.findIndex(f => f.key === 'same_person');
  const before = otherFields.slice(0, sameIdx + 1).map(f => fieldHtml(f)).join('');
  const after = otherFields.slice(sameIdx + 1).map(f => fieldHtml(f)).join('');
  qs('#dyn-fields').innerHTML = `${before}<div id="manager-fields">${managerFields.map(f => fieldHtml(f)).join('')}</div>${after}`;
  const sameCheckbox = qs('#same_person');
  function syncManagerFields() {
    const same = sameCheckbox.checked;
    qs('#manager-fields').style.display = same ? 'none' : '';
    qsa('#manager-fields input').forEach(input => { input.required = !same; if (same) input.value = ''; });
  }
  if (sameCheckbox) { sameCheckbox.addEventListener('change', syncManagerFields); syncManagerFields(); }
  loadGoogleMaps().then(() => {
    attachPlacesAutocomplete('address', { address:'address', city:'city', state:'state', zip:'zip' });
  });
})();

qs('#apply-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = qs('#submit-btn'); btn.disabled = true; btn.textContent = 'Submitting…';
  const data = Object.fromEntries(new FormData(e.target).entries());
  qsa('input[type=checkbox]', e.target).forEach(c => data[c.name] = c.checked);
  try {
    const { message } = await api('/stores/apply', { method: 'POST', body: data });
    qs('#apply-form').style.display = 'none';
    qs('#done-section').style.display = 'block';
    qs('#done-message').textContent = message;
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = 'Submit Application';
  }
});
</script>
</body>
</html>
