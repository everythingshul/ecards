<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Application — everythingshul</title>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div class="public-wrap">
  <div class="public-header">
    <div class="dot"><span>&#9670;</span></div>
    <h1>Store Application</h1>
    <p class="small-muted">Apply to become a participating gift card location. Our team will review your application and follow up on next steps.</p>
  </div>

  <form id="apply-form" class="card">
    <div class="section-title">Store Information</div>
    <label>Store Name <span class="req">*</span></label><input name="name" required>
    <label>Address</label><input id="store_address" name="address" autocomplete="off">
    <div class="grid-2">
      <div><label>City</label><input id="store_city" name="city"></div>
      <div><label>State</label><input id="store_state" name="state"></div>
    </div>
    <label>Zip</label><input id="store_zip" name="zip" style="max-width:160px">
    <label>Store Phone</label><input name="phone">

    <div class="section-title">Manager</div>
    <div class="grid-2">
      <div><label>Manager Name</label><input name="manager_name"></div>
      <div><label>Manager Phone</label><input name="manager_phone"></div>
    </div>
    <label>Manager Email</label><input name="manager_email">

    <div class="section-title">Owner</div>
    <div class="grid-2">
      <div><label>Owner Name</label><input name="owner_name"></div>
      <div><label>Owner Phone</label><input name="owner_phone"></div>
    </div>
    <label>Owner Email <span class="req">*</span></label><input name="owner_email" type="email" required>

    <div class="checkbox-row" style="margin-top:16px"><input type="checkbox" id="has_account" name="has_provider_account"><label style="margin:0" for="has_account">We already have a disccardpromos.com (or equivalent) merchant account</label></div>

    <label>Comments</label><textarea name="comments" rows="3"></textarea>

    <div style="margin-top:26px;text-align:right">
      <button type="submit" class="btn btn-primary" id="submit-btn">Submit Application</button>
    </div>
  </form>

  <div class="card" id="done-section" style="display:none;text-align:center">
    <h3>&#10003; Application Submitted</h3>
    <p class="small-muted" id="done-message"></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
loadGoogleMaps().then(() => {
  attachPlacesAutocomplete('store_address', { address:'store_address', city:'store_city', state:'store_state', zip:'store_zip' });
});

qs('#apply-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = qs('#submit-btn'); btn.disabled = true; btn.textContent = 'Submitting…';
  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd.entries());
  data.has_provider_account = fd.get('has_provider_account') === 'on';
  try {
    const { message } = await api('/stores/apply', { method: 'POST', body: data });
    qs('#apply-form').style.display = 'none';
    qs('#done-section').style.display = 'block';
    qs('#done-message').textContent = message;
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = 'Submit Application';
  }
});
</script>
</body>
</html>
