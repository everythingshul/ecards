<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Document — everythingshul</title>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div class="public-wrap">
  <div class="public-header">
    <div class="dot"><span>&#9670;</span></div>
    <h1 id="title">Sign Document</h1>
  </div>
  <div class="card" id="loading">Loading…</div>

  <div class="card" id="doc-section" style="display:none">
    <h3 id="doc-title"></h3>
    <iframe id="doc-frame" style="width:100%;height:460px;border:1px solid var(--border);border-radius:8px" src=""></iframe>
    <label style="margin-top:18px">Signer Full Name <span class="req">*</span></label>
    <input id="signer_name" placeholder="Type your full legal name">
    <label>Title / Role <span class="small-muted">(optional)</span></label>
    <input id="signer_title">
    <label>Signature <span class="req">*</span></label>
    <canvas id="sig-pad"></canvas>
    <div style="margin-top:8px"><button type="button" class="btn btn-outline btn-sm" id="clear-sig">Clear Signature</button></div>
    <div style="margin-top:20px;text-align:right">
      <button class="btn btn-primary" id="sign-btn">Sign Document</button>
    </div>
  </div>

  <div class="card" id="done-section" style="display:none;text-align:center">
    <h3>&#10003; Signed</h3>
    <p class="small-muted" id="done-message">Thank you — this document has been signed.</p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
let sigPad = null;

(async () => {
  if (!token) { qs('#loading').textContent = 'Missing signing link.'; return; }
  try {
    const { document: doc, entityName, alreadySigned } = await api(`/documents/sign/${token}`);
    qs('#loading').style.display = 'none';
    if (alreadySigned) { qs('#done-section').style.display = 'block'; return; }
    qs('#doc-section').style.display = 'block';
    qs('#doc-title').textContent = `${doc.title || 'Agreement'} — ${entityName || ''}`;
    qs('#doc-frame').src = `/api/documents/sign/${token}/pdf-preview`;
    sigPad = initSignaturePad('sig-pad');
    qs('#clear-sig').onclick = () => sigPad.clear();
  } catch (err) {
    qs('#loading').textContent = err.message;
  }
})();

qs('#sign-btn')?.addEventListener('click', async () => {
  const signerName = qs('#signer_name').value.trim();
  if (!signerName) return toast('Please type your full name', true);
  if (!sigPad || sigPad.isEmpty()) return toast('Please draw your signature', true);
  const btn = qs('#sign-btn'); btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    await api(`/documents/sign/${token}/sign`, { method: 'POST', body: { signer_name: signerName, signer_title: qs('#signer_title').value, signature_data: sigPad.toDataUrl() } });
    qs('#doc-section').style.display = 'none';
    qs('#done-section').style.display = 'block';
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = 'Sign Document';
  }
});
</script>
</body>
</html>
