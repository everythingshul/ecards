<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — everythingshul</title>
<link rel="stylesheet" href="/css/theme.css">
<style>
  body { background: var(--brand-bg); display:flex; flex-direction:column; min-height:100vh; }
  .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 20px; }
  .login-box { width: 380px; }
  .login-box .dot { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; margin: 0 auto 18px; }
  .login-box .dot span { color: var(--brand-gold); font-size: 22px; }
  .login-box h1 { color:#fdf7ea; text-align:center; font-size: 22px; }
</style>
</head>
<body>
<div class="login-wrap">
<div class="login-box">
  <div class="dot"><span>&#9670;</span></div>
  <h1>everythingshul e-cards</h1>
  <div class="card">
    <form id="login-form">
      <label>Email</label><input type="email" name="email" required autofocus>
      <label>Password</label><input type="password" name="password" required>
      <div style="margin-top:20px"><button class="btn btn-primary" style="width:100%">Sign In</button></div>
    </form>
    <p class="small-muted" style="text-align:center;margin-top:14px"><a href="/forgot-password.html">Forgot password?</a></p>
  </div>
</div>
</div>
<script src="/js/app.js"></script>
<script>renderPublicFooter();</script>
<script>
qs('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  try {
    const { token, user } = await api('/auth/login', { method: 'POST', body: data });
    Auth.set(token, user);
    if (user.role === 'shul') location.href = '/shul-portal/dashboard.html';
    else if (user.role === 'store') location.href = await storeLandingUrl(user);
    else location.href = '/admin/dashboard.html';
  } catch (err) { toast(err.message, true); }
});
</script>
</body>
</html>
