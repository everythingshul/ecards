<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Setup · Kipas Hair BP Platform</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/portal-theme.css">
<style>.step-dots{display:flex;gap:8px;justify-content:center;margin-bottom:24px}.step-dots span{width:10px;height:10px;border-radius:50%;background:var(--border)}.step-dots span.active{background:var(--brand-gold-dark)}.step-dots span.done{background:var(--success)}</style>
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireRole('store');
document.body.innerHTML = `
  <div class="public-wrap">
    <div class="public-header"><img class="brand-mark" src="/img/org-logo.png" alt="Organization logo"><h1>Complete Your Store Setup</h1></div>
    <div class="step-dots" id="dots"><span></span><span></span><span></span></div>
    <div class="card" id="wrap">Loading…</div>
  </div>`;

let store = null, step = 1;
const u = Auth.user();

(async () => {
  try {
    const { store: s } = await api(`/stores/${u.store_id}`);
    store = s;
    step = Math.min(3, (s.onboarding_step || 0) + 1);
    if (s.onboarding_step >= 3) { location.href = '/store-portal/dashboard.html'; return; }
    render();
  } catch (err) { qs('#wrap').innerHTML = `<p class="small-muted">${esc(err.message)}</p>`; }
})();

function updateDots() {
  qsa('#dots span').forEach((d, i) => { d.className = i + 1 < step ? 'done' : (i + 1 === step ? 'active' : ''); });
}

function render() {
  updateDots();
  if (step === 1) qs('#wrap').innerHTML = step1Html();
  else if (step === 2) qs('#wrap').innerHTML = step2Html();
  else qs('#wrap').innerHTML = step3Html();
  attachHandlers();
}

function step1Html() {
  return `
    <h3>1. Confirm Your Store Info</h3>
    <label>Store Name</label><input id="f-name" value="${esc(store.name)}">
    <label>Address</label><input id="f-address" value="${esc(store.address||'')}">
    <div class="grid-2"><div><label>City</label><input id="f-city" value="${esc(store.city||'')}"></div><div><label>State</label><input id="f-state" value="${esc(store.state||'')}"></div></div>
    <label>Store Phone</label><input id="f-phone" value="${esc(store.phone||'')}">
    <div class="divider"></div>
    <div class="grid-2"><div><label>Manager Name</label><input id="f-manager_name" value="${esc(store.manager_name||'')}"></div><div><label>Manager Phone</label><input id="f-manager_phone" value="${esc(store.manager_phone||'')}"></div></div>
    <label>Manager Email</label><input id="f-manager_email" value="${esc(store.manager_email||'')}">
    <div style="margin-top:20px;text-align:right"><button class="btn btn-primary" id="next-btn">Continue</button></div>`;
}
function step2Html() {
  return `
    <h3>2. Owner & Billing Contact</h3>
    <div class="grid-2"><div><label>Owner Name</label><input id="f-owner_name" value="${esc(store.owner_name||'')}"></div><div><label>Owner Phone</label><input id="f-owner_phone" value="${esc(store.owner_phone||'')}"></div></div>
    <label>Owner Email</label><input id="f-owner_email" value="${esc(store.owner_email||'')}">
    <p class="small-muted">This is who billing correspondence (amounts owed, payment schedule) will be sent to.</p>
    <div class="checkbox-row" style="margin-top:20px"><input type="checkbox" id="f-agree"><label style="margin:0">I agree to participate in the gift card program under the terms communicated by the administering organization.</label></div>
    <div style="margin-top:20px;text-align:right"><button class="btn btn-primary" id="next-btn">Continue</button></div>`;
}
function step3Html() {
  return `<h3>3. All Set</h3><p class="small-muted">Your setup information has been submitted. An administrator will finish activating your store and reach out with next steps.</p>
    <div style="margin-top:20px;text-align:right"><button class="btn btn-primary" id="finish-btn">Go to Dashboard</button></div>`;
}

function attachHandlers() {
  if (step === 1) qs('#next-btn').addEventListener('click', async () => {
    const info = { name: qs('#f-name').value, address: qs('#f-address').value, city: qs('#f-city').value, state: qs('#f-state').value,
      phone: qs('#f-phone').value, manager_name: qs('#f-manager_name').value, manager_phone: qs('#f-manager_phone').value, manager_email: qs('#f-manager_email').value };
    try { const { store: s } = await api(`/stores/${u.store_id}/onboarding`, { method: 'PUT', body: { step: 1, info } }); store = s; step = 2; render(); } catch (err) { toast(err.message, true); }
  });
  if (step === 2) qs('#next-btn').addEventListener('click', async () => {
    if (!qs('#f-agree').checked) return toast('Please agree to the program terms to continue', true);
    const info = { owner_name: qs('#f-owner_name').value, owner_phone: qs('#f-owner_phone').value, owner_email: qs('#f-owner_email').value };
    try { const { store: s } = await api(`/stores/${u.store_id}/onboarding`, { method: 'PUT', body: { step: 2, info, agree_terms: true } }); store = s; step = 3; render(); } catch (err) { toast(err.message, true); }
  });
  if (step === 3) qs('#finish-btn').addEventListener('click', async () => {
    try { await api(`/stores/${u.store_id}/onboarding`, { method: 'PUT', body: { step: 3 } }); location.href = '/store-portal/dashboard.html'; } catch (err) { toast(err.message, true); }
  });
}
</script>
</body>
</html>
