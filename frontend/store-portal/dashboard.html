<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Portal — everythingshul</title>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<script src="/js/app.js"></script>
<script>
Auth.requireAuth();
renderShell('/store-portal/dashboard.html', `
  <h2>Store Overview</h2>
  <div class="card" id="wrap">Loading…</div>
`);
(async () => {
  const u = Auth.user();
  try {
    const { store: s, transactionTotals } = await api(`/stores/${u.store_id}`);
    qs('#wrap').innerHTML = `
      <div class="stat-grid">
        <div class="stat-tile"><div class="num">${badge(s.setup_status, s.setup_status)}</div><div class="label">Setup Status</div></div>
        <div class="stat-tile"><div class="num">${transactionTotals.count}</div><div class="label">Transactions</div></div>
        <div class="stat-tile"><div class="num">${fmtMoney(transactionTotals.total_purchases)}</div><div class="label">Total Purchases</div></div>
        <div class="stat-tile"><div class="num">${fmtMoney(transactionTotals.total_refunds)}</div><div class="label">Total Refunds</div></div>
      </div>
      <div class="divider"></div>
      <h3>Store Info</h3>
      <p>${esc(s.name)}<br>${esc(s.address||'')} ${esc(s.city||'')}, ${esc(s.state||'')}<br>${esc(s.phone||'')}</p>`;
  } catch (err) { qs('#wrap').innerHTML = `<p class="small-muted">${esc(err.message)}</p>`; }
})();
</script>
</body>
</html>
